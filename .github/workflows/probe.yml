name: probe-ai
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: probe-ai}
      - name: Real prompt
        run: |
          echo "######## llm7 free-tier models"
          curl -sS -m 30 https://api.llm7.io/v1/models | jq -r '.data[] | select(.tier!="pro") | "\(.id)  tier=\(.tier) json=\(.json_mode) ctx=\(.context_window.tokens)"' | head -40
          echo "######## pollinations anonymous models"
          curl -sS -m 30 https://text.pollinations.ai/models | jq -r '.[] | "\(.name) tier=\(.tier // .anonymous // "")"' 2>/dev/null | head -30
          run(){ jq -n --rawfile p prompt.txt --arg m "$2" '{model:$m,messages:[{role:"user",content:$p}],temperature:0.3,max_tokens:4000}' > body.json
            for k in 1 2 3; do s=$(date +%s.%N); code=$(curl -sS -m 150 -o out.json -w '%{http_code}' -D h.txt "$1" -H 'content-type: application/json' -d @body.json); e=$(date +%s.%N)
              echo "######## $1 $2 call$k http=$code secs=$(echo "$e-$s"|bc) $(grep -iE 'ratelimit-remaining|x-ratelimit|retry-after' h.txt | tr -d '\r' | tr '\n' ' ')"
              jq -r '.choices[0].message.content // .error.message // .' out.json 2>/dev/null | head -c 900; echo; done; }
          run https://api.llm7.io/v1/chat/completions default
          run https://text.pollinations.ai/openai openai
