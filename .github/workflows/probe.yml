name: probe
on: push
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: probe-ai2}
      - run: |
          python3 - <<'PY'
          import json,urllib.request,time,re
          pr=open('prompt.txt').read()
          for mt in [6000,None]:
            body={"model":"openai","messages":[{"role":"user","content":pr}],"temperature":0.3,"referrer":"mamunbracu.github.io","private":True}
            if mt: body["max_tokens"]=mt
            t=time.time()
            try:
              r=urllib.request.urlopen(urllib.request.Request("https://text.pollinations.ai/openai",data=json.dumps(body).encode(),headers={"content-type":"application/json","Origin":"https://mamunbracu.github.io"}),timeout=180)
              d=json.load(r);c=d["choices"][0]["message"].get("content") or ""
              print("mt",mt,"ok",round(time.time()-t,1),"s len",len(c),"finish",d["choices"][0].get("finish_reason"),d.get("usage"))
              s=c[c.find("{"):c.rfind("}")+1]
              try: j=json.loads(s); print("JSON OK keys",list(j)[:12], "questions",len(j.get("questions",[])))
              except Exception as e: print("JSON FAIL",e); print(c[:600]); print("...",c[-400:])
            except Exception as e:
              print("mt",mt,"ERR",e, getattr(e,'read',lambda:b'')()[:300])
            time.sleep(50)
          PY
