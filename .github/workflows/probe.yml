name: probe
on: push
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          LONG=$(python3 -c "print(('The candidate answered the reading question about school costs in a full sentence. '*120).replace('\"',''))")
          probe(){ echo "=== $(date +%T) $1 mt=$2"; curl -s -m 120 -D h.txt -o b.txt -w "code=%{http_code} t=%{time_total}\n" -H 'content-type: application/json' -H 'Origin: https://mamunbracu.github.io' -H 'Referer: https://mamunbracu.github.io/' -X POST https://text.pollinations.ai/openai -d "{\"model\":\"openai\",\"messages\":[{\"role\":\"user\",\"content\":\"$RANDOM $1 Mark this and reply with JSON {\\\"level\\\":\\\"3+\\\",\\\"tips\\\":[..3 tips]}. $3\"}],\"max_tokens\":$2,\"referrer\":\"mamunbracu.github.io\",\"private\":true}"; grep -i 'retry-after\|ratelimit\|x-queue' h.txt; head -c 250 b.txt; echo; }
          probe short1 6000 ""
          probe short2 6000 ""
          sleep 20; probe after20 6000 ""
          sleep 45; probe after45 6000 ""
          sleep 50; probe long 6000 "$LONG"
          sleep 50; probe long_mt2000 2000 "$LONG"
          sleep 50; probe nomax 0 "$LONG"
