name: ai-probe
on:
  push:
    branches: [ai-probe]
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the live site to update
        run: |
          for i in $(seq 1 40); do
            if curl -s "https://mamunbracu.github.io/islpr_PRactise/?nocache=$RANDOM" | grep -q 'FREE_MODELS'; then echo "live site updated"; exit 0; fi
            sleep 10
          done
          echo "live site not updated yet"; exit 1
      - name: Real browser test on the live site
        run: |
          npm i -s playwright@1.49.1 >/dev/null 2>&1 && npx -y playwright@1.49.1 install --with-deps chromium >/dev/null 2>&1
          cat > t.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch(); const p = await (await b.newContext()).newPage();
            const t0 = Date.now(); const log = m => console.log(((Date.now()-t0)/1000).toFixed(1)+'s', m);
            p.on('pageerror', e => log('PAGE ERROR ' + e));
            await p.goto('https://mamunbracu.github.io/islpr_PRactise/#writing'); await p.waitForTimeout(1500);
            log('AI chip: ' + (await p.locator('#aiChip').innerText()));
            await p.locator('.item').first.click();
            await p.fill('#essay', 'Dear Property Manager,\n\nI am writing about the heater in my flat which has not work for two weeks. It is very cold at night and my childrens has been sick. I called the agent three times but nobody reply me.\n\nI would like the heater to be repaired by this Friday. Please contact me as soon as possible.\n\nYours sincerely,\nSam');
            await p.click('#sub');
            await p.waitForSelector('.result-head, #retry', { timeout: 240000 });
            const res = await p.locator('#wres').innerText();
            log('RESULT:\n' + res.slice(0, 900));
            log('highlighted errors: ' + await p.locator('.marked mark.err').count());
            await p.goto('https://mamunbracu.github.io/islpr_PRactise/#speaking'); await p.waitForTimeout(800);
            await p.locator('.item').first.click(); await p.click('#startiv');
            const ans = ['I am Sam, I come from Bangladesh and I am study teaching in Sydney.','I grow up in Dhaka, it is very busy city with many people.','Because I want better future and good education.','I usually work and sometime go to the beach with friends.','I am looking forward to finish my degree next year.'];
            for (const a of ans) { await p.fill('#sa', a); await p.click('#nq'); await p.waitForTimeout(150); }
            await p.waitForSelector('#sres .result-head, #sres #retry', { timeout: 240000 });
            log('SPEAKING:\n' + (await p.locator('#sres').innerText()).slice(0, 400));
            await b.close();
          })().catch(e => { console.log('TEST ERROR', e.message); process.exit(1); });
          JS
          node t.js
